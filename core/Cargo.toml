[package]
name = "cuttar-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

[lib]
name = "cuttar_core"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
log = { version = "0.4", features = ["std"] }
tiny_http = "0.12"
rand = "0.8"
parking_lot = "0.12"
which = "7"
ureq = { version = "2", features = ["json"] }
url = "2"
regex = "1"

[dev-dependencies]
tempfile = "3"
